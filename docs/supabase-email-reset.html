<!--
  Pegar en Supabase → Authentication → Email Templates → Reset Password

  Subject:
  Restablece tu contraseña — Qyntra Gym

  Body (HTML): el contenido de abajo.
  El botón DEBE usar {{ .ConfirmationURL }} para que Supabase valide el token
  y luego redirija a /reset-password (redirectTo de la API).
-->
<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#0B0B10;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0B0B10;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background:#14141C;border-radius:16px;overflow:hidden;border:1px solid #2A2A36;">
            <tr>
              <td style="padding:28px 28px 8px;text-align:center;">
                <div style="display:inline-block;width:48px;height:48px;line-height:48px;background:#FF6B35;border-radius:10px;font-size:28px;font-weight:700;color:#ffffff;">Q</div>
                <h1 style="margin:16px 0 0;font-size:22px;letter-spacing:0.04em;">
                  <span style="color:#FF6B35;">QYNTRA</span>
                  <span style="color:#ffffff;"> GYM</span>
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 28px;text-align:center;">
                <h2 style="margin:0 0 12px;font-size:20px;color:#ffffff;">Restablecer contraseña</h2>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#A1A1AA;">
                  Recibimos una solicitud para cambiar la contraseña de tu cuenta en Qyntra Gym.
                  Pulsa el botón para elegir una nueva.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block;background:#FF6B35;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:999px;"
                >
                  Cambiar contraseña
                </a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#71717A;">
                  Si no pediste este cambio, ignora este correo. El enlace caduca en poco tiempo.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-size:11px;color:#52525B;">© Qyntra Gym</p>
        </td>
      </tr>
    </table>
  </body>
</html>
